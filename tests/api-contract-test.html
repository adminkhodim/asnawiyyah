<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>STEP 4A — API Contract Integration Test</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f6f7f9;color:#172033;margin:0}
    .wrap{max-width:980px;margin:40px auto;padding:0 20px}
    h1{margin-bottom:6px}.muted{color:#64748b}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin:16px 0}
    input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px}
    button{padding:10px 14px;border:0;border-radius:8px;background:#0f766e;color:#fff;font-weight:700;cursor:pointer}
    button.secondary{background:#334155}
    table{width:100%;border-collapse:collapse;margin-top:14px}
    th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:14px;vertical-align:top}
    .pass{color:#047857;font-weight:800}.fail{color:#b91c1c;font-weight:800}.skip{color:#a16207;font-weight:800}
    pre{white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#e2e8f0;padding:12px;border-radius:10px;font-size:12px}
  </style>
</head>
<body>
<div class="wrap">
  <h1>STEP 4A — Integration Test API Contract</h1>
  <div class="muted">Read-only + negative-path test. Tidak membuat berita/banner/PPDB baru.</div>

  <div class="card">
    <label><strong>Apps Script Web App URL</strong></label>
    <input id="baseUrl" value="https://script.google.com/macros/s/AKfycbzUAlAJPvT_IULb3OsR2PvIfPov365jFj7cTrMJydex-92fhcaD5Wf8TLqv-URt-TrhNw/exec">
    <p><button onclick="runAll()">▶ Jalankan Semua Test</button> <button class="secondary" onclick="clearResults()">Bersihkan</button></p>
    <div id="summary" class="muted">Belum dijalankan.</div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Test</th><th>HTTP</th><th>Result</th><th>Detail</th></tr></thead>
      <tbody id="results"></tbody>
    </table>
  </div>

  <div class="card">
    <strong>Raw response terakhir</strong>
    <pre id="raw">-</pre>
  </div>
</div>

<script>
const tests = [];

function baseUrl() {
  return document.getElementById('baseUrl').value.trim().replace(/\/+$/,'');
}
function add(name, status, http, detail, raw) {
  tests.push({name,status,http,detail,raw});
  document.getElementById('raw').textContent = raw ? JSON.stringify(raw,null,2) : '-';
  render();
}
function render() {
  const body=document.getElementById('results');
  body.innerHTML=tests.map(t=>`
    <tr>
      <td>${escapeHtml(t.name)}</td>
      <td>${t.http ?? '-'}</td>
      <td class="${t.status==='PASS'?'pass':t.status==='FAIL'?'fail':'skip'}">${t.status}</td>
      <td>${escapeHtml(t.detail||'')}</td>
    </tr>`).join('');
  const pass=tests.filter(x=>x.status==='PASS').length;
  const fail=tests.filter(x=>x.status==='FAIL').length;
  document.getElementById('summary').textContent =
    `PASS ${pass} · FAIL ${fail} · Total ${tests.length}`;
}
function clearResults(){tests.length=0;render();document.getElementById('summary').textContent='Belum dijalankan.';}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

async function get(action, params={}) {
  const u=new URL(baseUrl());
  u.searchParams.set('action',action);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u.toString(),{headers:{Accept:'application/json'}});
  const text=await r.text();
  let data; try{data=JSON.parse(text)}catch{throw new Error(`Response bukan JSON: ${text.slice(0,200)}`)}
  return {http:r.status,data};
}
async function post(body) {
  const r=await fetch(baseUrl(),{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8',Accept:'application/json'},
    body:JSON.stringify(body)
  });
  const text=await r.text();
  let data; try{data=JSON.parse(text)}catch{throw new Error(`Response bukan JSON: ${text.slice(0,200)}`)}
  return {http:r.status,data};
}

async function one(name, fn, validator){
  try{
    const x=await fn();
    const ok=validator(x);
    add(name,ok?'PASS':'FAIL',x.http,ok?'Contract sesuai':`Contract mismatch: ${JSON.stringify(x.data)}`,x.data);
  }catch(e){
    add(name,'FAIL','-',e.message);
  }
}

async function runAll(){
  clearResults();

  await one('GET getKabar — HTTP + JSON + status success',
    ()=>get('getKabar'),
    x=>x.http===200 && x.data && x.data.status==='success' && Array.isArray(x.data.data));

  await one('GET getBanner — HTTP + JSON + status success',
    ()=>get('getBanner'),
    x=>x.http===200 && x.data && x.data.status==='success' && Array.isArray(x.data.data));

  await one('GET checkStatus tanpa NISN — validation error',
    ()=>get('checkStatus'),
    x=>x.http===200 && x.data && x.data.status==='error' &&
       /NISN wajib diisi/i.test(x.data.message||''));

  await one('POST tanpa action — validation error',
    ()=>post({}),
    x=>x.http===200 && x.data && x.data.status==='error' &&
       /action wajib diisi/i.test(x.data.message||''));

  await one('POST unknown action — router error',
    ()=>post({action:'__contract_test_unknown__'}),
    x=>x.http===200 && x.data && x.data.status==='error' &&
       /Action tidak dikenal/i.test(x.data.message||''));

  await one('POST deleteBanner tanpa ID — validation error',
    ()=>post({action:'deleteBanner'}),
    x=>x.http===200 && x.data && x.data.status==='error' &&
       /ID Banner wajib diisi/i.test(x.data.message||''));

  await one('POST toggleBanner tanpa field — validation error',
    ()=>post({action:'toggleBanner'}),
    x=>x.http===200 && x.data && x.data.status==='error' &&
       /ID Banner dan status wajib diisi/i.test(x.data.message||''));

  document.getElementById('summary').textContent +=
    ' — Test mutasi data (save/delete/toggle/PPDB valid) sengaja tidak dijalankan otomatis.';
}

render();
</script>
</body>
</html>
